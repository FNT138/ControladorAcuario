; Configuración base para proyecto Arduino Multiagente (PlatformIO)
; Permite al Agente Tester correr la suite predefinida en PC (native) y verificar compilación de placa (uno)

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNIT_TEST
    -Wall
