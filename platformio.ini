; Configuración PlatformIO para ControladorPeceraDistancia
; Soporta tests unitarios nativos en PC (native), ESP32-C3 SuperMini, ESP32 clásico y Arduino Nano

[platformio]
default_envs = nanoatmega328

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_flags =
    -Wall
    -Wextra

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNIT_TEST
    -Wall
